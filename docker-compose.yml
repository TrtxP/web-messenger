services:
  postgres:
    image: postgres:15-alpine
    container_name: mobile-messenger-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-0347}
      POSTGRES_DB: ${DB_NAME:-mobile_messenger_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mobile-messenger-backend
    restart: always
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:-0347}@postgres:5432/${DB_NAME:-mobile_messenger_db}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-a7f2e1c94b38d05e2f6a89c41d7e35b0c8491f2e6d3a5b7c8e9f0123456789ab}
      JWT_SECRET: ${JWT_SECRET:-mobile_messenger_jwt_access_secret_key_2026_super_secure}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-mobile_messenger_jwt_refresh_secret_key_2026_super_secure}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

volumes:
  pgdata:


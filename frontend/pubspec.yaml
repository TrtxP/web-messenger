name: mobile_messenger
description: A Flutter messaging application.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  firebase_messaging: ^16.7.0
  file_selector: ^1.0.3
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  http: ^1.2.2
  http_parser: ^4.1.2
  image_picker: ^1.2.3
  record: ^6.1.2
  shared_preferences: ^2.3.2
  audioplayers: ^6.8.1
  video_player: ^2.9.5
  video_player_win: ^2.3.11
  video_compress: ^3.1.4
  socket_io_client: ^3.1.6
  firebase_core: ^4.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
